  <script>
    // Old links used /#/plugin/...; send them to the real address before the app starts.
    (function () {
      try {
        var h = window.location.hash;
        if (h.indexOf('#/') === 0) {
          window.history.replaceState(null, '', h.slice(1));
        }
        // Apply the saved theme early so the page does not flash light before dark.
        var t = window.localStorage.getItem('theme');
        if (t === 'dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) { /* ignore */ }
    })();
  </script>
